<!doctype html>
<html lang="en" data-palette="emerald">
<head>
<meta charset="utf-8" />
<title>Forge · sd-scripts trainer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forge.css">
</head>
<body>

<div id="app">
  <!-- ────────── Sidebar ────────── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">Forge</div>
        <div class="brand-sub mono">sd-scripts · v0.10.5</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-item" data-page="dashboard">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="5" height="6" rx="1"/><rect x="9" y="2.5" width="5" height="3" rx="1"/><rect x="9" y="7" width="5" height="6.5" rx="1"/><rect x="2" y="10" width="5" height="3.5" rx="1"/></svg>
        Dashboard
      </div>

      <div class="nav-section">Train</div>
      <div class="nav-item active" data-page="train">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5l1.6 3.4 3.7.5-2.7 2.6.7 3.7L8 9.9l-3.3 1.8.7-3.7L2.7 5.4l3.7-.5L8 1.5z"/></svg>
        New training run
      </div>
      <div class="nav-item" data-page="jobs">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg>
        Jobs &amp; queue
        <span class="nav-tail mono" id="nav-badge-jobs">—</span>
      </div>
      <div class="nav-item" data-page="logs">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 13.5h11M4.5 13V8M7.5 13V4M10.5 13V9.5M13.5 13V6.5"/></svg>
        Live monitor
      </div>

      <div class="nav-section">Library</div>
      <div class="nav-item" data-page="models">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5l5.5-2 5.5 2v7l-5.5 2-5.5-2v-7z"/><path d="M2.5 4.5L8 6.5l5.5-2"/><path d="M8 6.5v7"/></svg>
        Base models
        <span class="nav-tail mono" id="nav-badge-models">—</span>
      </div>
      <div class="nav-item" data-page="loras">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>
        Trained LoRAs
        <span class="nav-tail mono" id="nav-badge-loras">—</span>
      </div>
      <div class="nav-item" data-page="datasets">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M2.5 3.5v4c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-4"/><path d="M2.5 7.5v4c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-4"/></svg>
        Datasets
      </div>

      <div class="nav-section">Tools</div>
      <div class="nav-item" data-page="utilities">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10.5 2L13 4.5l-2.5 2.5L8 4.5 10.5 2zM2 8.5l3.5 3.5M5.5 12l-2 2 .5.5h2l1.5-1.5M11 7l3 3-1.5 1.5-3-3"/></svg>
        Utilities
      </div>
      <div class="nav-item" data-page="settings">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4M12.6 12.6l-1.4-1.4M4.8 4.8L3.4 3.4"/></svg>
        Settings
      </div>
    </nav>

    <div class="sidebar-foot">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M5 6.5h6M5 9h4"/></svg>
      <div class="gpu-meter">
        <div class="row">
          <span id="gpu-name">—</span><span class="mono" id="gpu-pct">22.1 / 24 GB</span>
        </div>
        <div class="bar"><div class="fill" id="gpu-fill" style="width:92%"></div></div>
      </div>
    </div>
  </aside>

  <!-- ────────── Main ────────── -->
  <div class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs">
        <a href="#" data-go="train">Train</a><span class="sep">/</span>
        <a href="#" class="here">portrait_v3 · LoRA</a>
      </div>
      <div class="spacer"></div>

      <div class="progress-pill" id="progress-pill" title="Running training job">
        <span class="dot"></span>
        <span class="label" id="prog-label">Step 1,824 · loss 0.1142</span>
        <div class="bar"><div class="fill" id="prog-fill" style="width:46%"></div></div>
        <span class="num mono" id="prog-num">1,824 / 4,000</span>
      </div>

      <button class="icon-btn" title="Notifications">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 6.5a4.5 4.5 0 119 0v2l1.5 2H2l1.5-2v-2zM6 13a2 2 0 004 0"/></svg>
      </button>
      <button class="icon-btn danger" title="Stop accelerate worker">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v6M4.5 4.5a5.5 5.5 0 107 0"/></svg>
      </button>
    </header>

    <main class="page" id="page"></main>
  </div>
</div>

<!-- ════════════════════ TEMPLATES ════════════════════ -->

<!-- ────── DASHBOARD ────── -->
<template id="tpl-dashboard">
<section data-screen-label="Dashboard">
  <div class="page-h">
    <div>
      <h1>Welcome back</h1>
      <p id="dash-summary">Loading…</p>
    </div>
    <div class="actions">
      <button class="btn">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h4l1.5 2h5.5v7h-11v-9z"/></svg>
        Resume from checkpoint
      </button>
      <button class="btn primary" data-go="train">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg>
        New training run
      </button>
    </div>
  </div>

  <div class="grid-4" style="margin-bottom: 20px;">
    <div class="stat-card"><div class="k">Active job</div><div class="v" id="dash-active-pct">—</div><div class="delta mono" id="dash-active-steps">no active job</div></div>
    <div class="stat-card"><div class="k">Queue depth</div><div class="v" id="dash-queue-count">0<small>jobs</small></div><div class="delta mono" id="dash-queue-wait">queue empty</div></div>
    <div class="stat-card"><div class="k">VRAM headroom</div><div class="v" id="dash-vram-val">—</div><div class="delta" id="dash-vram-delta"></div></div>
    <div class="stat-card"><div class="k">Disk</div><div class="v" id="dash-disk-val">—</div><div class="delta mono" id="dash-disk-delta"></div></div>
  </div>

  <div class="grid-2" style="grid-template-columns: 1.5fr 1fr; align-items: stretch;">
    <div class="panel" id="dash-run-panel">
      <div class="panel-h">
        <h3>Active run</h3>
        <span class="badge dot good" id="dash-run-badge" style="display:none">running</span>
        <span class="grow"></span>
        <span class="mono" style="color:var(--fg-dim);font-size:11px" id="dash-run-pid"></span>
        <button class="btn sm" data-go="logs">Open monitor →</button>
      </div>
      <div class="panel-b" id="dash-run-body">
        <div class="empty" id="dash-run-empty">No job currently running</div>
        <div id="dash-run-content" style="display:none">
          <div style="display:flex; align-items:flex-end; justify-content:space-between; gap: 16px; margin-bottom: 14px">
            <div>
              <div class="mono" style="font-size: 11px; color: var(--fg-dim); letter-spacing: .04em; text-transform: uppercase;">Output</div>
              <div style="font-size: 16px; font-weight: 600; margin-top: 4px;" id="dash-run-name">—</div>
              <div style="color:var(--fg-mute); font-size: 12px; margin-top: 2px;" id="dash-run-meta">—</div>
            </div>
            <div style="text-align:right">
              <div class="mono" style="font-size: 22px; font-weight: 600; letter-spacing:-.01em" id="dash-run-loss">—</div>
              <div style="color:var(--fg-mute); font-size: 11.5px;">loss · current</div>
            </div>
          </div>

          <!-- progress bar -->
          <div class="bar" style="height:6px; border-radius:3px; background:var(--line); margin-bottom:6px;">
            <div class="fill" id="dash-run-bar" style="width:0%;height:100%;border-radius:3px;background:var(--accent);transition:width .4s"></div>
          </div>
          <div class="mono" style="font-size:11px;color:var(--fg-dim);margin-bottom:14px" id="dash-run-step">step — / —</div>

          <!-- loss chart -->
          <div class="loss-chart" id="loss-chart">
            <svg viewBox="0 0 600 140" preserveAspectRatio="none" width="100%" height="140">
              <defs>
                <linearGradient id="lossfill" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <g class="grid" stroke="var(--line)" stroke-width="1">
                <line x1="0" y1="35"  x2="600" y2="35"/>
                <line x1="0" y1="70"  x2="600" y2="70"/>
                <line x1="0" y1="105" x2="600" y2="105"/>
              </g>
              <path id="loss-fill" d="" fill="url(#lossfill)"/>
              <path id="loss-line" d="" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </div>

          <div class="divider"></div>

          <div class="grid-3" style="gap: 12px;">
            <div><div class="k mono" style="font-size:10.5px;color:var(--fg-dim);letter-spacing:.04em;text-transform:uppercase">Throughput</div><div style="font-size:15px;font-weight:600;margin-top:4px" id="dash-run-thru">—</div></div>
            <div><div class="k mono" style="font-size:10.5px;color:var(--fg-dim);letter-spacing:.04em;text-transform:uppercase">ETA</div><div style="font-size:15px;font-weight:600;margin-top:4px" id="dash-run-eta">—</div></div>
            <div><div class="k mono" style="font-size:10.5px;color:var(--fg-dim);letter-spacing:.04em;text-transform:uppercase">GPU</div><div style="font-size:15px;font-weight:600;margin-top:4px" id="dash-run-gpu">—</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h"><h3>Recent runs</h3></div>
      <div class="panel-b" style="padding: 0;">
        <table class="run-table">
          <thead><tr><th>Run</th><th>Type</th><th>Loss</th><th>Status</th></tr></thead>
          <tbody id="dash-recent-runs"></tbody>
        </table>
      </div>
    </div>
  </div>

</section>
</template>

<!-- ────── TRAIN (the marquee page) ────── -->
<template id="tpl-train">
<section data-screen-label="New training run">
  <div class="page-h">
    <div>
      <h1>New training run</h1>
      <p>Configure a LoRA, fine-tune, DreamBooth, or ControlNet job. Settings map 1:1 to <span class="mono">accelerate launch</span> arguments — preview the CLI at the bottom.</p>
    </div>
    <div class="actions">
      <button class="btn">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h11v9h-11v-9zM2.5 6h11M5 4.5h.01M7 4.5h.01"/></svg>
        Load preset
      </button>
      <button class="btn">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 8l3 3 6-6"/></svg>
        Validate
      </button>
      <button class="btn primary">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3l8 5-8 5V3z"/></svg>
        Start training
      </button>
    </div>
  </div>

  <div class="tabs" id="train-tabs">
    <div class="tab active" data-tab="basics">Basics</div>
    <div class="tab" data-tab="network">Network</div>
    <div class="tab" data-tab="schedule">Schedule</div>
    <div class="tab" data-tab="memory">Memory &amp; precision</div>
    <div class="tab" data-tab="sampling">Sampling</div>
    <div class="tab" data-tab="advanced">Advanced</div>
    <span class="grow"></span>
    <span class="badge dot good" style="margin-bottom: 8px;">Config valid</span>
  </div>

  <div class="grid-2" style="grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); align-items: start;">
    <div class="train-form" id="train-form">

      <div class="tab-pane active" data-pane="basics">
      <!-- BASICS panel -->
      <div class="panel">
        <div class="panel-h"><h3>Run identity</h3></div>
        <div class="panel-b" style="padding: 4px 22px;">
          <div class="form-row">
            <div class="lbl-col"><h4>Output name</h4><p>Used for the saved <span class="mono">.safetensors</span>, sample folder, and TensorBoard run.</p></div>
            <div>
              <input class="input mono" id="output-name-input" value="" placeholder="my_lora" style="width:100%; max-width: 360px;" />
              <div class="mono" id="output-path-preview" style="color:var(--fg-dim); font-size: 11px; margin-top: 6px"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="lbl-col"><h4>Training mode</h4><p>Each mode loads a different sd-scripts entry point.</p></div>
            <div class="mode-grid">
              <label class="mode-card sel"><input type="radio" name="mode" checked /><div class="hd"><span class="dot"></span><b>LoRA</b><span class="badge solid mono">train_network.py</span></div><p>Low-rank adapter. Small files, fast, composable.</p></label>
              <label class="mode-card"><input type="radio" name="mode" /><div class="hd"><span class="dot"></span><b>Fine-tune</b><span class="badge solid mono">fine_tune.py</span></div><p>Full UNet weights. Highest fidelity, large checkpoints.</p></label>
              <label class="mode-card"><input type="radio" name="mode" /><div class="hd"><span class="dot"></span><b>DreamBooth</b><span class="badge solid mono">train_db.py</span></div><p>Subject-driven, with class prior preservation.</p></label>
              <label class="mode-card"><input type="radio" name="mode" /><div class="hd"><span class="dot"></span><b>Textual Inversion</b><span class="badge solid mono">train_ti.py</span></div><p>Learn an embedding token. SD/SDXL only.</p></label>
              <label class="mode-card"><input type="radio" name="mode" /><div class="hd"><span class="dot"></span><b>ControlNet-LLLite</b><span class="badge solid mono">sdxl_train_lllite.py</span></div><p>Lightweight conditioning network for SDXL/Anima.</p></label>
              <label class="mode-card"><input type="radio" name="mode" /><div class="hd"><span class="dot"></span><b>Inpainting</b><span class="badge solid mono">+ --inpainting</span></div><p>SD 1.5 / SDXL inpaint adapter training.</p></label>
            </div>
          </div>
        </div>
      </div>

      <!-- BASE MODEL panel -->
      <div class="panel" style="margin-top: 16px;">
        <div class="panel-h"><h3>Base model</h3><span class="grow"></span><a class="btn ghost sm" data-go="models">Browse library →</a></div>
        <div class="panel-b" style="padding: 4px 22px;">

          <div class="form-row">
            <div class="lbl-col"><h4>Architecture</h4><p>The script and dataset bucketing change per architecture. v-prediction is auto-set when needed.</p></div>
            <div class="arch-strip">
              <button class="arch-pill">SD 1.5</button>
              <button class="arch-pill sel">SDXL</button>
              <button class="arch-pill">SD 3.5</button>
              <button class="arch-pill">FLUX.1</button>
              <button class="arch-pill">LUMINA</button>
              <button class="arch-pill">HunyuanImage 2.1</button>
              <button class="arch-pill">Anima preview</button>
            </div>
          </div>

          <div class="form-row">
            <div class="lbl-col"><h4>Checkpoint</h4><p>Local <span class="mono">.safetensors</span> file or HF repo id.</p></div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <select class="select mono" id="ckpt-select" style="width:100%; max-width: 480px;">
                <option value="">No models found — check models_dir in Settings</option>
              </select>
              <div class="mono" id="ckpt-info" style="color:var(--fg-dim); font-size: 11px; margin-top:4px;"></div>
            </div>
            <div class="row-flex" style="margin-top: 10px;">
              <label class="row-flex" style="gap:6px;cursor:pointer"><input type="checkbox" class="checkbox" checked /> <span>Use VAE from base</span></label>
              <span style="color:var(--fg-soft)">·</span>
              <label class="row-flex" style="gap:6px;cursor:pointer"><input type="checkbox" class="checkbox" name="use_vae_override" /> <span>Override VAE</span></label>
              <input class="input mono sm-input" id="vae-input" placeholder="path/to/vae.safetensors" disabled style="flex:1; min-width: 200px"/>
            </div>
            <!-- Anima extra encoders (shown only when Anima arch is selected) -->
            <div id="anima-extras" style="display:none; margin-top:10px; display:none;">
              <div class="row-flex" style="gap:8px; flex-wrap:wrap; align-items:center;">
                <label style="font-size:11px; color:var(--fg-dim); white-space:nowrap;">Qwen3 text encoder <span style="color:var(--fg-soft)">(required)</span></label>
                <input class="input mono sm-input" id="qwen3-input" placeholder="path/to/qwen3_0.6b.safetensors or dir" style="flex:1; min-width:280px"/>
              </div>
              <div class="row-flex" style="gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px;">
                <label style="font-size:11px; color:var(--fg-dim); white-space:nowrap;">T5 tokenizer dir <span style="color:var(--fg-soft)">(optional — defaults to configs/t5_old/)</span></label>
                <input class="input mono sm-input" id="t5-tokenizer-input" placeholder="path/to/t5_tokenizer/" style="flex:1; min-width:280px"/>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- DATASET panel -->
      <div class="panel" style="margin-top: 16px;">
        <div class="panel-h"><h3>Dataset</h3><span class="grow"></span><a class="btn ghost sm" data-go="datasets">Open Datasets →</a></div>
        <div class="panel-b" style="padding: 4px 22px;">

          <div class="form-row">
            <div class="lbl-col"><h4>Source</h4><p>Pick a curated dataset, or point to a folder of images + caption files.</p></div>
            <div>
              <select class="select mono" id="ds-select" style="width:100%; max-width:480px;">
                <option value="">— select dataset —</option>
              </select>
              <div class="mono" id="ds-meta" style="font-size:11px; color:var(--fg-dim); margin-top:6px;"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="lbl-col"><h4>Captions</h4><p>How sd-scripts reads the per-image caption.</p></div>
            <div class="row-flex">
              <button class="btn sm primary">.txt sidecar</button>
              <button class="btn sm">.caption</button>
              <button class="btn sm">JSON metadata</button>
              <button class="btn sm">Folder name</button>
              <span style="color:var(--fg-soft)">·</span>
              <label class="row-flex" style="gap:6px;cursor:pointer"><input type="checkbox" class="checkbox" checked /> <span>Shuffle tags</span></label>
              <label class="row-flex" style="gap:6px;cursor:pointer"><input type="checkbox" class="checkbox" /> <span>Drop tags p=0.1</span></label>
              <label class="row-flex" style="gap:6px;cursor:pointer"><input type="checkbox" class="checkbox" /> <span>Keep first N tokens</span></label>
            </div>
          </div>

          <div class="form-row">
            <div class="lbl-col"><h4>Resolution &amp; bucketing</h4><p>Aspect-ratio bucketing fits your dataset's distribution without cropping.</p></div>
            <div>
              <div class="row-flex" id="resolution-btns">
                <button class="btn sm primary">512</button>
                <button class="btn sm">768</button>
                <button class="btn sm">1024</button>
                <button class="btn sm" id="custom-res-btn">Custom…</button>
                <span style="color:var(--fg-soft)">·</span>
                <label class="row-flex" style="gap:6px"><input type="checkbox" class="checkbox" checked/> <span>enable_bucket</span></label>
                <label class="row-flex" style="gap:6px"><input type="checkbox" class="checkbox" checked/> <span>bucket_no_upscale</span></label>
              </div>
              <div id="custom-res-inputs" style="display:none; margin-top:8px; display:none;">
                <input id="custom-res-w" class="input mono" style="width:80px" placeholder="1280"/>
                <span style="margin:0 6px;color:var(--fg-dim)">×</span>
                <input id="custom-res-h" class="input mono" style="width:80px" placeholder="960"/>
                <span style="margin-left:6px;font-size:11px;color:var(--fg-dim)">px (multiple of 64)</span>
              </div>
              <div class="bucket-strip" id="bucket-strip"></div>
            </div>
          </div>
        </div>
      </div>
      </div><!-- /basics -->

      <!-- NETWORK pane -->
      <div class="tab-pane" data-pane="network">
        <div class="panel">
          <div class="panel-h"><h3>Network architecture</h3><span class="grow"></span><span class="badge solid mono">--network_module</span></div>
          <div class="panel-b" style="padding: 4px 22px;">
            <div class="form-row">
              <div class="lbl-col"><h4>Module</h4><p>The class loaded as <span class="mono">network_module</span>. LyCORIS variants extend LoRA with extra factorizations.</p></div>

    <div class="util-card util-card--disabled">
      <div class="util-card-hd">
        <div class="util-ic">#</div>
        <div><h4>WD14 Tagger <span class="badge solid" style="margin-left:6px">Coming soon</span></h4><p>Auto-tag a folder with <span class="mono">wd-v1-4-tagger</span>.</p></div>
      </div>
    </div>
    <div class="util-card util-card--disabled">
      <div class="util-card-hd">
        <div class="util-ic">≡</div>
        <div><h4>Caption editor <span class="badge solid" style="margin-left:6px">Coming soon</span></h4><p>Bulk find/replace and reorder tags across a dataset.</p></div>
      </div>
    </div>
    <div class="util-card util-card--disabled">
      <div class="util-card-hd">
        <div class="util-ic">▢</div>
        <div><h4>Bucket preview <span class="badge solid" style="margin-left:6px">Coming soon</span></h4><p>Render the actual aspect-ratio buckets for a folder.</p></div>
      </div>
    </div>
    <div class="util-card util-card--disabled">
      <div class="util-card-hd">
        <div class="util-ic">⏵</div>
        <div><h4>Mask loss preview <span class="badge solid" style="margin-left:6px">Coming soon</span></h4><p>Visualize per-image masks for masked-loss training.</p></div>
      </div>
    </div>

  </div>
</section>
</template>

<!-- ────── SETTINGS ────── -->
<template id="tpl-settings">
<section data-screen-label="Settings">
  <div class="page-h">
    <div>
      <h1>Settings</h1>
      <p>Local installation paths and accelerate defaults.</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><h3>Environment</h3></div>
    <div class="panel-b" style="padding: 4px 22px;">
      <div class="form-row">
        <div class="lbl-col"><h4>sd-scripts root</h4><p>Folder where <span class="mono">accelerate launch</span> is invoked.</p></div>
        <div><input id="cfg-scripts-root" class="input mono" style="width:100%; max-width: 420px;"/></div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>Python</h4><p>venv used to run training jobs.</p></div>
        <div><input id="cfg-python" class="input mono" style="width:100%; max-width: 420px;"/></div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>Models dir</h4><p>Where Forge scans for base checkpoints.</p></div>
        <div><input id="cfg-models-dir" class="input mono" style="width:100%; max-width: 420px;"/></div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>Datasets dir</h4><p>Root folder for dataset subfolders.</p></div>
        <div><input id="cfg-datasets-dir" class="input mono" style="width:100%; max-width: 420px;"/></div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>Output dir</h4><p>Where trained LoRAs and checkpoints are saved.</p></div>
        <div><input id="cfg-output-dir" class="input mono" style="width:100%; max-width: 420px;"/></div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>CPU threads</h4><p>Threads per process passed to <span class="mono">accelerate launch</span>.</p></div>
        <div><input id="cfg-cpu-threads" class="input mono" type="number" min="1" style="width:80px;"/></div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>Default mixed precision</h4><p>Override per-run on the Train page.</p></div>
        <div class="row-flex" id="cfg-precision-btns">
          <button class="btn sm" data-prec="no">no</button>
          <button class="btn sm" data-prec="fp16">fp16</button>
          <button class="btn sm primary" data-prec="bf16">bf16</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel hide" style="margin-top: 16px; display:none;">
    <div class="panel-h"><h3>Appearance</h3></div>
    <div class="panel-b" style="padding: 4px 22px;">
      <div class="form-row">
        <div class="lbl-col"><h4>Accent palette</h4><p>Switch the highlight color across the app.</p></div>
        <div class="row-flex" id="palette-picker">
          <button class="palette-swatch sel" data-palette="emerald" style="--c: #10b981" title="Emerald"></button>
          <button class="palette-swatch" data-palette="marine" style="--c: #6aa9ff" title="Marine"></button>
          <button class="palette-swatch" data-palette="amber" style="--c: #d29a3a" title="Amber"></button>
        </div>
      </div>
      <div class="form-row">
        <div class="lbl-col"><h4>Density</h4><p>Compact mode tightens row heights and padding.</p></div>
        <div class="row-flex">
          <button class="btn sm primary">Comfortable</button>
          <button class="btn sm">Compact</button>
        </div>
      </div>
    </div>
  </div>
</section>
</template>

<script src="forge.js"></script>
</body>
</html>
